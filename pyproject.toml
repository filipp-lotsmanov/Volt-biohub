[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/volt_biohub"]

[project]
name = "volt-biohub"
version = "0.1.0"
description = "Cell tracking for the Biohub 'Cell Tracking During Development' challenge: I/O, metrics, detection and linking"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
dependencies = [
    "torch>=2.9.1",
    "tracksdata @ git+https://github.com/royerlab/tracksdata@main",
    "zarr>=3.0.10",
    "geff>=1.3",
    "numpy",
    "polars",
    "dask[array]",
    "scipy",
    "tqdm",
    "kagglehub>=1.0.2",
    "python-dotenv>=1.2.3",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
]

[project.scripts]
# CLAUDE.md documents `CUDA_VISIBLE_DEVICES=$(volt_gpu)` for the shared box;
# without this entry point that command fails and every GPU run silently
# DataParallels across cards other tenants have filled.
volt_gpu = "volt_biohub.gpu:main"

[project.optional-dependencies]
viz = [
    "napari>=0.5",
    "pyqt6",
]

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=8.4.2",
    "ruff>=0.9",
]

# --- Blackwell (RTX 5070 / RTX Pro 6000, sm_120) needs a CUDA >= 12.8 build. ---
# PyPI's Windows torch wheels are CPU-only, so Windows pulls from PyTorch's
# cu130 index instead. Linux/macOS keep the default PyPI wheel. If the Linux
# training box turns out to be Blackwell too, widen the marker below and check
# that sm_120 shows up in torch.cuda.get_arch_list().
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow — deselect with '-m \"not slow\"'",
]

[tool.ruff]
target-version = "py311"
src = ["src", "scripts", "visualize"]
line-length = 120

[tool.ruff.lint]
pydocstyle = { convention = "numpy" }
ignore = [
    "E712",
    # "µm" and en-dashes in comments/docstrings are deliberate — the metric is
    # defined in microns, and 14 of the inherited lint hits were just that.
    "RUF002",
    "RUF003",
]
select = [
    "E",    # style errors
    "W",    # style warnings
    "F",    # flakes
    "D417", # Missing argument descriptions in Docstrings
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "A001", # flake8-builtins
    "RUF",  # ruff-specific rules
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D", "S"]

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = false
